# Netlify config for The Pearson Co.
# Static HTML site, no build step. The live website lives in site/; the content
# engine (workforce, scripts, content-plan, docs) stays at the repo root and is
# never deployed. Netlify auto-deploys on every push to main.

[build]
  publish = "site"
  command = ""

# Pretty URLs must stay off. When on, Netlify's HTML post-processing rewrites
# every internal link in the served HTML to drop the .html extension, so the
# live site linked to /blog/slug while the sitemap, canonical tags, og:url and
# JSON-LD all declared /blog/slug.html. Both forms return 200 with identical
# content, so every page existed at two crawlable URLs and the entire internal
# link graph pointed at the set the sitemap did not list. That is why Search
# Console reported "Referring page: None detected" against the .html URLs.
# The site's own declared canonical form is .html; the served links must match it.
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false
